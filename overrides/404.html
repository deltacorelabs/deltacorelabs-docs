{% extends "base.html" %}

{% block htmltitle %}
<title>404 - Page Not Found | {{ config.site_name }}</title>
{% endblock %}

{% block content %}
<style>
  .error-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60vh;
    text-align: center;
    padding: 2rem;
  }

  .error-code {
    font-size: clamp(6rem, 15vw, 12rem);
    font-weight: 900;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1;
    margin: 0;
    animation: float 3s ease-in-out infinite;
    font-family: 'Space Grotesk', sans-serif;
  }

  @keyframes float {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-20px); }
  }

  .error-title {
    font-size: clamp(1.5rem, 4vw, 2.5rem);
    font-weight: 700;
    margin: 1rem 0 0.5rem;
    color: var(--md-default-fg-color);
    font-family: 'Space Grotesk', sans-serif;
  }

  .error-description {
    font-size: 1.1rem;
    color: var(--md-default-fg-color--light);
    max-width: 500px;
    margin: 0 auto 2rem;
    line-height: 1.6;
  }

  .error-actions {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .error-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.875rem 1.75rem;
    border-radius: 50px;
    font-weight: 600;
    font-size: 0.9rem;
    text-decoration: none;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    border: none;
    cursor: pointer;
  }

  .error-btn--primary {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
  }

  .error-btn--primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
    color: #fff;
  }

  .error-btn--secondary {
    background: var(--md-default-fg-color--lightest);
    color: var(--md-default-fg-color);
    border: 2px solid var(--md-default-fg-color--lighter);
  }

  .error-btn--secondary:hover {
    transform: translateY(-2px);
    border-color: #667eea;
    color: #667eea;
  }

  .error-illustration {
    width: 100%;
    max-width: 400px;
    margin-bottom: 2rem;
    opacity: 0.8;
  }

  .error-particles {
    position: absolute;
    width: 100%;
    height: 100%;
    overflow: hidden;
    pointer-events: none;
  }

  .particle {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    opacity: 0.3;
    animation: drift 8s infinite;
  }

  @keyframes drift {
    0%, 100% { transform: translate(0, 0) rotate(0deg); opacity: 0.3; }
    25% { transform: translate(100px, -50px) rotate(90deg); opacity: 0.6; }
    50% { transform: translate(-50px, -100px) rotate(180deg); opacity: 0.3; }
    75% { transform: translate(50px, 50px) rotate(270deg); opacity: 0.6; }
  }
</style>

<div class="error-container">
  <div class="error-particles">
    <div class="particle" style="top: 20%; left: 10%; animation-delay: 0s;"></div>
    <div class="particle" style="top: 60%; left: 80%; animation-delay: 2s;"></div>
    <div class="particle" style="top: 40%; left: 50%; animation-delay: 4s;"></div>
    <div class="particle" style="top: 80%; left: 20%; animation-delay: 6s;"></div>
    <div class="particle" style="top: 10%; left: 70%; animation-delay: 1s;"></div>
  </div>
  
  <p class="error-code">404</p>
  <h1 class="error-title">Page Not Found</h1>
  <p class="error-description">
    The page you're looking for doesn't exist or has been moved.
    Let's get you back on track.
  </p>
  
  <div class="error-actions">
    <a href="{{ config.site_url }}" class="error-btn error-btn--primary">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      Go Home
    </a>
    <a href="javascript:history.back()" class="error-btn error-btn--secondary">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Go Back
    </a>
  </div>
</div>
{% endblock %}
