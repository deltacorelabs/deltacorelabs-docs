{% extends "base.html" %}

{% block htmltitle %}
<title>{{ config.site_name }} - {{ page.title if page.title else "Documentation" }}</title>
{% endblock %}

{% block extrahead %}
<!-- Preconnect for Performance -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- Additional Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<!-- Meta Tags -->
<meta name="theme-color" content="#4051b5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
{% endblock %}

{% block content %}
{{ super() }}
{% endblock %}

{% block footer %}
{{ super() }}
<!-- Back to Top Button -->
<div id="back-to-top" class="back-to-top" aria-label="Back to top">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
    <path d="M13 20h-2V8l-5.5 5.5-1.42-1.42L12 4.16l7.92 7.92-1.42 1.42L13 8v12z" fill="currentColor"/>
  </svg>
</div>
{% endblock %}
